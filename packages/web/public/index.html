<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0B1F3A" />
        <meta name="description" content="PitchChart — Pitcher-focused baseball tracking" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
        <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
        <title>PitchChart</title>
        <!--
      No-FOUC theming bootstrap. Runs before first paint so the correct
      light/dark mode AND any persisted org/team brand are applied before React
      mounts (React's providers set these in a post-paint effect, which flashes).
      It only sets data-theme and replays the derived var-map that
      `contexts/TeamThemeContext.tsx` persisted via `deriveBrandTokens` — no color
      math here, so there is nothing to keep in sync with `styles/colorMath.ts`.
    -->
        <script>
            (function () {
                try {
                    var mode = localStorage.getItem('theme:mode');
                    var effective = mode;
                    if (mode !== 'light' && mode !== 'dark') {
                        effective =
                            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                    }
                    document.documentElement.setAttribute('data-theme', effective);

                    var vars = localStorage.getItem('brand:vars');
                    if (vars) {
                        var tokens = JSON.parse(vars);
                        var root = document.documentElement;
                        Object.keys(tokens).forEach(function (key) {
                            root.style.setProperty(key, tokens[key]);
                        });
                    }
                } catch (e) {
                    /* localStorage/JSON unavailable — fall through to CSS defaults. */
                }
            })();
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>

</html>
